name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop
      - feature/*
env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.6.0

jobs:
  # Job 1: Code Quality and Testing
  quality-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root
      
      - name: Install project
        run: poetry install --no-interaction
      
      - name: Install Ruff
        run: pip install ruff
      
      - name: Lint with Ruff
        id: ruff-lint
        run: ruff check src/ tests/
      
      - name: Format check with Ruff
        id: ruff-format
        run: ruff format --check src/ tests/
      
      - name: Run type checking
        run: poetry run mypy src/
        continue-on-error: true
      
      - name: Run unit tests with coverage
        run: |
          poetry run pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=pytest-report.xml
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
            token: ${{ secrets.CODECOV_TOKEN }}
            slug: victorgalantech/template-lambda
            fail_ci_if_error: true # Si Codecov falla, que falle el pipeline
      
      - name: Check coverage threshold
        run: |
          COVERAGE=$(poetry run coverage report --precision=2 | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage is below 80% (current: ${COVERAGE}%)"
            echo ""
            echo "To check coverage locally, run:"
            echo "  poetry run pytest tests/ --cov=src --cov-report=term-missing"
            echo ""
            echo "Make sure to add tests for uncovered code!"
            exit 1
          else
            echo "✅ Coverage is ${COVERAGE}% (meets 80% requirement)"
          fi


  # Job 2: Build and Push Docker Image to ECR
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: quality-and-test
    #if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Set ECR repository name
        id: set-repo-name
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "ECR_REPOSITORY=${REPO_NAME}" >> $GITHUB_ENV
          echo "Using ECR repository name: ${REPO_NAME}"
      
      - name: Check if ECR repository exists
        id: check-ecr
        run: |
          if aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "✅ Repository '${{ env.ECR_REPOSITORY }}' exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Repository '${{ env.ECR_REPOSITORY }}' does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create ECR repository if it doesn't exist
        if: steps.check-ecr.outputs.exists == 'false'
        run: |
          echo "Creating ECR repository: ${{ env.ECR_REPOSITORY }}"
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256 \
            --tags Key=ManagedBy,Value=GitHub-Actions Key=Project,Value=${{ github.event.repository.name }} Key=Repository,Value=${{ github.repository }}
          echo "✅ ECR repository '${{ env.ECR_REPOSITORY }}' created successfully"
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # - name: Build and push Docker image
      #   id: build-push
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: ./Dockerfile
      #     push: true
      #     tags: ${{ steps.meta.outputs.tags }}
      #     labels: ${{ steps.meta.outputs.labels }}
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max
      #     platforms: linux/amd64
      
      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-push.outputs.digest }}
      #     format: 'sarif'
      #     output: 'trivy-results.sarif'
      #     Opcional: Si quieres fallar el pipeline en caso de error crítico
      #     exit-code: '1'
      #     severity: 'CRITICAL,HIGH'

      # - name: Upload Trivy results to GitHub Security
      #   uses: github/codeql-action/upload-sarif@v3
      #   if: always()
      #   with:
      #     sarif_file: 'trivy-results.sarif'

# ... (Pasos anteriores hasta Set up Docker Buildx son iguales) ...

      # PASO 1: Construir y cargar en el Docker del Runner
      - name: Build and Load for Scanning
        id: build-load
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true       # ⚠ IMPORTANTE: Esto la deja en local, no la sube
          push: false      # No subimos todavía
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PASO 2: Escanear la imagen LOCAL
      - name: Scan image with Trivy (Blocking)
        uses: aquasecurity/trivy-action@master
        with:
          # Usamos una de las tags generadas. Como es local, Docker la reconoce.
          # Nota: Trivy necesita un solo nombre de imagen.
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} # Usamos un tag específico o una estrategia para seleccionar uno
          # OJO: Para simplificar, asegúrate que steps.meta genere un tag predecible o usa:
          # image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'table'   # Para ver el log en consola primero
          exit-code: '1'    # ⚠ CRÍTICO: Rompe el pipeline si hay fallos
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # PASO 2.5: (Opcional) Generar reporte SARIF para GitHub Security
      # Puedes correr Trivy dos veces (una para bloquear consola, otra para reporte)
      # o configurar el paso anterior para generar archivo y no fallar, y luego checkear el archivo.
      
      # PASO 3: Subir a ECR (Solo si el paso 2 pasó)
      - name: Push to ECR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: false
          push: true       # ⚠ AHORA SÍ subimos
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # ⚠ Reusa el caché del paso 1
          cache-to: type=gha,mode=max  

  # Job 3: Deploy Infrastructure with Terraform
  terraform-deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    #if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true
      
      - name: Terraform Init
        id: init
        run: terraform init
      
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var="environment=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}" \
            -var="image_tag=latest" \
            -out=tfplan
        continue-on-error: false
      
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
      
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: terraform apply -auto-approve -input=false tfplan
      
      - name: Terraform Output
        id: output
        run: |
          echo "lambda_function_url=$(terraform output -raw lambda_function_url)" >> $GITHUB_OUTPUT
          echo "lambda_function_arn=$(terraform output -raw lambda_function_arn)" >> $GITHUB_OUTPUT
      
      - name: Comment PR with Terraform outputs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Outputs 🚀
            - **Lambda Function URL**: \`${{ steps.output.outputs.lambda_function_url }}\`
            - **Lambda Function ARN**: \`${{ steps.output.outputs.lambda_function_arn }}\`
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })