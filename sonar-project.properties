# SonarQube Configuration
sonar.projectKey=victorgalantech_template-lambda
sonar.organization=victorgalantech
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=tests

# Python specific settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**,**/dist/**,**/build/**

# Test exclusions
sonar.test.exclusions=tests/**

# Coverage exclusions
sonar.coverage.exclusions=tests/**,**/__init__.py
